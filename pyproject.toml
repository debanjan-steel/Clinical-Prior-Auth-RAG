[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-prior-auth-rag"
version = "1.0.0"
description = "Intelligent Prior Authorization & Utilization Management (UM) RAG Evaluator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastembed>=0.5.0",
    "qdrant-client>=1.10.0",
    "rank-bm25>=0.2.2",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "streamlit>=1.40.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
